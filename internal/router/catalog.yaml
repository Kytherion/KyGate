# KyGate built-in model catalog.
#
# Prices are US dollars per million tokens, as published by each provider when
# this KyGate version was built. Prices change: check them, and override or
# extend this list with a catalog file (KYGATE_CATALOG, or catalog.yaml in the
# data directory). A model that is not listed is still served; its cost is
# reported as unpriced.
#
# A request's model is matched to the longest id that it starts with, so
# "gpt-4o-mini-2024-07-18" is priced as gpt-4o-mini.
#
# kind is chat (the default) or embedding: only chat models are routing targets.
#
# cache_write is the price of writing the provider's prompt cache (Anthropic,
# 5-minute cache: 1.25 x input). cached_input is the price of a cache read.

models:
  # Anthropic
  - { id: claude-fable-5-2,  family: anthropic, tier: frontier, context: 1000000, price: { input: 8.00,  output: 40.00, cached_input: 0.20, cache_write: 10.00 } }
