[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kygate-guard"
version = "0.1.2"
description = "KyGate Guard: the ML service that detects personal data and threats for the KyGate gateway. It detects; the gateway enforces."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.66",
  "protobuf>=5.28",
]

[project.optional-dependencies]
# ML detection: the inference software for model packs. Optional: the base
# Guard runs recognizers only.
ml = ["onnxruntime>=1.20", "tokenizers>=0.20", "numpy>=1.26"]
test = ["pytest>=8"]

[project.scripts]
kygate-guard = "kygate_guard.server:main"

[tool.setuptools.packages.find]
include = ["kygate_guard*"]

[tool.setuptools.package-data]
"kygate_guard.catalog" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
