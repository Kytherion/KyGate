{{- if .Values.serviceAccount.create }}
# The KyGate pods' identity: Vault's Kubernetes login, or a cloud's workload
# identity (annotations), unwraps the master key with it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kygate.serviceAccount" . }}
  labels: {{- include "kygate.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
